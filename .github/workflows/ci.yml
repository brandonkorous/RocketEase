name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mis
          POSTGRES_PASSWORD: mis
          POSTGRES_DB: make_it_social
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mis -d make_it_social"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mis:mis@localhost:5432/make_it_social
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000
      BETTER_AUTH_URL: http://localhost:5001
      NEXT_PUBLIC_APP_URL: http://localhost:5001
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Migrations apply cleanly and schema is in sync
        working-directory: apps/platform
        run: |
          pnpm db:migrate
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci-drift-check
          if ls db/migrations/*ci-drift-check* >/dev/null 2>&1; then
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi
      - name: Build
        run: pnpm -r build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://mis:mis@localhost:5050/make_it_social
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000
      BETTER_AUTH_URL: http://localhost:5001
      NEXT_PUBLIC_APP_URL: http://localhost:5001
      NEXT_TELEMETRY_DISABLED: 1
      SMTP_URL: smtp://localhost:5025
      MAIL_FROM: Make It Social <no-reply@make-it-social.local>
      TOKEN_MASTER_KEY: Y2ktb25seS10b2tlbi1tYXN0ZXIta2V5LTMyLWJ5dGVzISE=
      PROVIDERS_ENABLE_MOCK: 1
      STORAGE_ENDPOINT: http://localhost:5090
      STORAGE_PUBLIC_ENDPOINT: http://localhost:5090
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: mis-media
      STORAGE_ACCESS_KEY: mis
      STORAGE_SECRET_KEY: mis-minio-secret
      STORAGE_FORCE_PATH_STYLE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, Mailpit, MinIO
        run: docker compose up -d --wait
      - name: Migrate
        working-directory: apps/platform
        run: pnpm db:migrate
      - name: Build platform
        working-directory: apps/platform
        run: pnpm build
      - name: Install Playwright browser
        working-directory: apps/platform
        run: pnpm exec playwright install --with-deps chromium
      - name: Start app + worker
        working-directory: apps/platform
        run: |
          (pnpm start > app.log 2>&1 &)
          (pnpm exec tsx worker/index.ts > worker.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:5001/api/health && break; sleep 2; done
      - name: E2E
        working-directory: apps/platform
        run: pnpm test:e2e
      - name: Logs on failure
        if: failure()
        working-directory: apps/platform
        run: tail -n 200 app.log worker.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/platform/playwright-report
            apps/platform/e2e/.results
          retention-days: 7

  images:
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: web, file: apps/web/Dockerfile }
          - { name: platform, file: apps/platform/Dockerfile }
          - { name: worker, file: apps/platform/Dockerfile.worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Swap registry/login for the sparx ACR when wiring into the sparx.works Terraform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
