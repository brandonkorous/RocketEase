apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}-platform
    {{- include "rocketease.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platform.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-platform }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-platform }
      annotations:
        {{- include "rocketease.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "rocketease.podSpecCommon" . | nindent 6 }}
      containers:
        - name: platform
          image: {{ include "rocketease.image.platform" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000 }]
          {{- include "rocketease.envFrom" . | nindent 10 }}
          # Liveness never touches the database: a probe that restarts a pod because
          # Postgres is busy hits every replica at once. Readiness does query.
          startupProbe: { httpGet: { path: /api/health/live, port: 3000 }, periodSeconds: 5, failureThreshold: 24 }
          readinessProbe: { httpGet: { path: /api/health/ready, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health/live, port: 3000 }, periodSeconds: 20 }
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    {{- include "rocketease.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ .Release.Name }}-platform }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 3000 }]
