{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: {{ .Release.Name }}-web
    {{- include "rocketease.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-web }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-web }
    spec:
      {{- include "rocketease.podSpecCommon" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "rocketease.image.web" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 20 }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "rocketease.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ .Release.Name }}-web }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 3000 }]
{{- end }}
