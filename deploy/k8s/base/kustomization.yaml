# Base manifests for the sparx AKS cluster (aks-sparx-prod-cus, namespace
# `rocketease`). Images and config come from the overlay; Secrets are created by
# the deploy workflow from Key Vault. Never commit real secrets.
#
# THERE IS NO INGRESS RESOURCE HERE, and that is not an omission. This cluster
# runs no nginx-ingress and no cert-manager: the shared Caddy in the `sparx-prod`
# namespace terminates TLS and reverse-proxies to these Services cross-namespace
# by ClusterIP. RocketEase's host blocks live in wize-infrastructure's
# k8s/ingress/Caddyfile (wizeworksllc/wize-infrastructure, applied by that repo's
# release), and every hostname must also be allow-listed for on-demand TLS (see
# deploy/README).
# An Ingress object applied here would be silently inert — nothing watches it.
#
# The migrate and db-role Jobs are likewise absent: they are applied by
# .github/workflows/deploy.yml pinned to the image SHA being released, and waited
# on before any Deployment rolls.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rocketease
resources:
  - namespace.yaml
  - web.yaml
  - platform.yaml
  - worker.yaml
  - media-worker.yaml
labels:
  - pairs: { app.kubernetes.io/part-of: rocketease }
    includeSelectors: false
