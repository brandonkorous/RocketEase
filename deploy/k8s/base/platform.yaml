apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
spec:
  replicas: 2
  selector: { matchLabels: { app: platform } }
  template:
    metadata: { labels: { app: platform } }
    spec:
      containers:
        - name: platform
          image: rocketease/platform:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            # DATABASE_URL, BETTER_AUTH_SECRET, SMTP_URL, TOKEN_MASTER_KEY, provider client secrets
            - secretRef: { name: platform-env }
            # BETTER_AUTH_URL, NEXT_PUBLIC_APP_URL, MAIL_FROM, LOG_LEVEL
            - configMapRef: { name: platform-config }
          # Liveness must never touch the database. A probe that restarts a pod
          # because Postgres is busy hits every replica at once and turns a
          # degradation into an outage. Readiness does query, so a replica that
          # cannot get a connection leaves the Service while its siblings serve.
          # /api/health itself is the operator view — never wire a probe to it.
          startupProbe: { httpGet: { path: /api/health/live, port: 3000 }, periodSeconds: 5, failureThreshold: 24 }
          readinessProbe: { httpGet: { path: /api/health/ready, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health/live, port: 3000 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: platform
spec:
  selector: { app: platform }
  ports: [{ port: 80, targetPort: 3000 }]
