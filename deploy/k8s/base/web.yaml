apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: rocketease/web:latest
          ports: [{ containerPort: 3000 }]
          env:
            # WizeLens: send-only tracing to WizeLens Cloud (project `rocketease`). The
            # key is per app (vault `wizelens-key-web`); optional, so a missing key
            # leaves the app running and untraced rather than failing the pod.
            - name: WIZELENS_ENABLED
              value: 'true'
            - name: WIZELENS_HUB
              value: https://app.wizelens.com
            - name: WIZELENS_SAMPLE_RATE
              value: '0.25'
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: platform-env, key: WIZELENS_KEY_WEB, optional: true }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
