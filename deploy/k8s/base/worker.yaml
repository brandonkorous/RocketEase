apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 30 # pg-boss graceful stop waits up to 15s
      containers:
        - name: worker
          image: rocketease/worker:latest
          env:
            # WizeLens: send-only tracing to WizeLens Cloud (project `rocketease`). The
            # key is per app (vault `wizelens-key-worker`); optional, so a missing key
            # leaves the app running and untraced rather than failing the pod.
            - name: WIZELENS_ENABLED
              value: 'true'
            - name: WIZELENS_HUB
              value: https://app.wizelens.com
            - name: WIZELENS_SAMPLE_RATE
              value: '0.25'
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: platform-env, key: WIZELENS_KEY_WORKER, optional: true }
          envFrom:
            - secretRef: { name: platform-env }
            - configMapRef: { name: platform-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, allowPrivilegeEscalation: false }
