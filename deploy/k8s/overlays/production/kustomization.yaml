apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rocketease
resources:
  - ../../base

# IMAGE NAMES ARE HYPHENATED AND LOWERCASE, deliberately.
#
# A Docker reference may not contain uppercase, so the obvious
# `ghcr.io/${{ github.repository }}/web` is invalid here twice over: the repo is
# `brandonkorous/RocketEase`, and a slash would address a nested package that
# does not exist. Either mistake fails the pull with a 401 that reads like a
# missing tag while the images sit untouched beside it.
#
# These packages must ALSO be public — the cluster pulls anonymously and no
# manifest here carries an imagePullSecret. A new GHCR package is private by
# default; see deploy/README.md.
images:
  - name: rocketease/web
    newName: ghcr.io/brandonkorous/rocketease-web
    newTag: latest
  - name: rocketease/platform
    newName: ghcr.io/brandonkorous/rocketease-platform
    newTag: latest
  - name: rocketease/worker
    newName: ghcr.io/brandonkorous/rocketease-worker
    newTag: latest

# Non-secret runtime config.
#
# NEXT_PUBLIC_APP_URL appears here AND as a build arg, which is correct rather
# than redundant: server code reads it at request time (lib/connections.ts,
# lib/reports/deliver.ts, the SCIM routes), while lib/auth-client.ts reads it in
# the browser, where Next has already inlined it at build time.
#
# The other NEXT_PUBLIC_* vars are client-only and are build args ONLY
# (see apps/platform/Dockerfile). Adding one here would look configured and do
# nothing at all.
configMapGenerator:
  - name: platform-config
    literals:
      - BETTER_AUTH_URL=https://app.rocketease.com
      - NEXT_PUBLIC_APP_URL=https://app.rocketease.com
      - MAIL_FROM=RocketEase <hello@rocketease.com>
      - LOG_LEVEL=info
      - STORAGE_DRIVER=azure
      - AZURE_STORAGE_CONTAINER=media
      # RocketEase's own operators, who reach /staff and grant betas. NOT a
      # credential, and deliberately here rather than in Key Vault: granting
      # operator access should need a reviewed change, not one silent az command.
      #
      # Bootstrap only — a `staff_user` row wins over this list, and the address
      # must have a VERIFIED email before it is honoured.
      - STAFF_EMAILS=bkorous@gmail.com
      # BETA_FEATURES is deliberately NOT set here. It is the same kind of
      # bootstrap, but a beta grant is per-TENANT state: putting organization ids
      # in git makes every enrolment a deploy and every revocation a rollback.
      # /staff writes an audited feature_grant row instead — which is why
      # STAFF_EMAILS above has to work first.

      # Drafting spend, per MILLION tokens. Keyed on what aiModel() returns,
      # which on Azure is the DEPLOYMENT name — so if that deployment is ever
      # repointed at a different model, this rate has to move with it.
      #
      # gpt-5.4, DataZoneStandard, read from Azure's retail price API on
      # 2026-09-01 and taking the rate currently in effect (input was repriced
      # 2.75 -> 3.00 on 2026-06-01). Unset, costUsd stays null and credits are
      # the only billed unit — the cap still works, the dollar figure is absent.
      - AI_PRICES_JSON={"rocketease-text":{"inputPerMTok":3.0,"outputPerMTok":16.5}}

      # Media generation spend. NOT secrets and NOT Terraform outputs — operator
      # choices, so they live in git where a change is reviewed.
      #
      # EMPTY MEANS NO LIMIT. And a per-job ceiling with no rate for the routed
      # model refuses EVERY job, by design ("we don't know what this costs" is
      # the worst reason to spend) — so these two move together or not at all.
      #
      # The rate is per IMAGE; Azure bills gpt-image-2 per TOKEN and publishes no
      # per-image price, so this is measured, not copied. Against this deployment
      # on 2026-08-31 a medium-quality image cost $0.004–$0.040 depending on how
      # busy the picture is (packages/media/src/openai/models.ts records the
      # readings), and a real generation on 2026-09-01 recorded $0.0154. $0.05
      # rounds UP past the busiest measured, so the ceiling errs toward refusing
      # rather than spending — without overstating a typical image five-fold the
      # way the first guess of $0.08 did.
      #
      # Actual spend is NOT this number — media_job.vendor_cost_usd comes from
      # the token usage the vendor reports back, which is what the monthly
      # ceiling accrues against.
      - AI_MEDIA_RATES_JSON={"azure-gpt-image-2":0.05}
      # A job caps at 4 images (lib/actions/media.ts), so $0.50 clears any real
      # request and still stops one that has gone strange.
      - MEDIA_CEILING_USD_PER_JOB=0.50
      # ~300 images/month/org. The blast radius of a loop, not a business limit.
      - MEDIA_CEILING_USD_PER_ORG_MONTH=25.00
    options:
      # A rolling ConfigMap name would restart every pod on any edit, so the
      # name stays plain. That is safe ONLY because the deploy job rewrites
      # `newTag: latest` to the commit SHA: a config change always ships inside
      # a commit, so the pod template changes and the rollout carries it.
      #
      # It is NOT safe by itself. `envFrom.configMapRef` is resolved once, at
      # pod start — exactly like the secretRef the env-hash annotation exists
      # for. Editing this ConfigMap in the cluster by hand changes nothing until
      # something else forces a new ReplicaSet.
      disableNameSuffixHash: true

# Secret `platform-env` (app config) and `db-admin` (migration credentials, Jobs
# only) are created by the `deploy` job in .github/workflows/ci.yml from Key
# Vault. Not generated here — a secret in git is a secret leaked.

# Restart pods when platform-env changes.
#
# `envFrom.secretRef` is resolved once, at pod start. Applying a changed Secret
# does not restart anything, so a credential rotated in Key Vault would reach
# the cluster and never be read — the symptom is an app that behaves as if the
# secret were still unset, with a Secret that plainly contains it. That is
# exactly what happened with the provider credentials on 2026-08-29.
#
# The deploy job rewrites the placeholder with a hash of the secret's contents,
# so the pod template changes when — and only when — that content changes.
# `web` is absent deliberately: it mounts no secret.
patches:
  - target: { kind: Deployment, name: platform }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: { rocketease.works/env-hash: "__ENV_HASH__" }
  - target: { kind: Deployment, name: worker }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: { rocketease.works/env-hash: "__ENV_HASH__" }
  - target: { kind: Deployment, name: media-worker }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: { rocketease.works/env-hash: "__ENV_HASH__" }
