services:
  postgres:
    image: postgres:17-alpine
    container_name: mis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mis
      POSTGRES_PASSWORD: mis
      POSTGRES_DB: make_it_social
    ports:
      - "5050:5432"
    volumes:
      - mis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mis -d make_it_social"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mis-mailpit
    restart: unless-stopped
    ports:
      - "5025:1025"   # SMTP
      - "5026:8025"   # web UI http://localhost:5026
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    image: minio/minio:latest
    container_name: mis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mis
      MINIO_ROOT_PASSWORD: mis-minio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5001,http://localhost:5000"
    ports:
      - "5090:9000"   # S3 API
      - "5091:9001"   # console http://localhost:5091 (mis / mis-minio-secret)
    volumes:
      - mis-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mis mis-minio-secret &&
      mc mb --ignore-existing local/mis-media &&
      echo bucket-ready"

volumes:
  mis-pgdata:
  mis-minio:
