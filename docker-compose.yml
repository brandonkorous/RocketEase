# Pinned so a directory rename can't fork the project (and orphan its volumes).
name: rocketease

services:
  postgres:
    image: postgres:17-alpine
    container_name: rke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rke
      POSTGRES_PASSWORD: rke
      POSTGRES_DB: rocketease
    ports:
      - "5050:5432"
    volumes:
      - rke-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rke -d rocketease"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: rke-mailpit
    restart: unless-stopped
    ports:
      - "5025:1025"   # SMTP
      - "5026:8025"   # web UI http://localhost:5026
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Chainguard's build, pinned by digest: MinIO's own images stopped pulling, Docker Hub
  # on 2026-09-18 and quay.io on 2026-10-22 ("unauthorized"), each breaking CI with no
  # commit behind it. It ships `mc` for the healthcheck. Root, because its default user
  # cannot open the data folder ("file access denied"); dev and CI only.
  minio:
    image: cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    user: "0:0"
    container_name: rke-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rke
      MINIO_ROOT_PASSWORD: rke-minio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5001,http://localhost:5000"
    ports:
      - "5090:9000"   # S3 API
      - "5091:9001"   # console http://localhost:5091 (rke / rke-minio-secret)
    volumes:
      - rke-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in only (`docker compose --profile init up minio-init`). The platform
  # creates the bucket itself at boot (STORAGE_AUTO_CREATE_BUCKET), so the daily
  # dev stack starts no one-shot container that could leave a name behind, and
  # waits on no healthcheck implemented inside a third-party image.
  minio-init:
    # The same image: it carries `mc` and a shell.
    image: cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 rke rke-minio-secret; do echo 'waiting for minio'; sleep 1; done &&
      mc mb --ignore-existing local/rke-media &&
      echo bucket-ready"

volumes:
  rke-pgdata:
  rke-minio:
